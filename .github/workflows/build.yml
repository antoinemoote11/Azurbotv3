name: Build AzurBot Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract AzurBot ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path . -Filter "AzurBot_Windows_FINAL102_CORRIGE.zip" -File | Select-Object -First 1

          if (-not $zip) {
            Write-Error "Archive AzurBot introuvable"
            exit 1
          }

          Expand-Archive -Path $zip.FullName -DestinationPath source -Force

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EXE
        shell: pwsh
        run: |
          dotnet publish "source/AzurBot.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AzurBot-Windows
          path: publish/
